[workspace]
resolver = "2"
members = [
    "crates/txt-core",
    "crates/txt-sync",
    "crates/txt-gui",
]

[workspace.package]
version = "1.0.1"
edition = "2021"
authors = ["txt-editor contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/NicoMancinelli/txt"
readme = "README.md"

[workspace.dependencies]
ropey = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = { version = "0.12", features = ["arc_lock"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
eframe = "0.29"
egui = "0.29"
thiserror = "2.0"
crossbeam-channel = "0.5"
regex = "1.12.4"
walkdir = "2.5.0"
